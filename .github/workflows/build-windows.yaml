
name: Build DeepAICode2API for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build gateway
        run: |
          mkdir dist
          go build -trimpath -o dist/deepaicode2api.exe .

      - name: Build registration CLI
        run: go build -trimpath -o dist/register.exe ./cmd/register

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: DeepAICode2API-Windows
          path: dist/*.exe
